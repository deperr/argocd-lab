apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nginx-demo
  namespace: nginx-app02
  annotations:
    nginx.ingress.kubernetes.io/upstream-hash-by: ""
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /nginx-app02
            pathType: Prefix
            backend:
              service:
                name: nginx-demo
                port:
                  number: 80
